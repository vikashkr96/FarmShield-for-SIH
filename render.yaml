services:
  # FarmShield Backend API Service
  - type: web
    name: farmshield-backend-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore # or frankfurt / oregon / ohio
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: '*'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
